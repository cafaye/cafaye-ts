# gate.yml — how cafaye-ts is gated, declared rather than guessed.
#
# WHY THIS FILE IS HERE, AND WHAT IT IS NOT. core owns the format
# (schemas/gate.schema.json), the checker (harness/gate_check.py) and the
# reasoning (docs/gate.md). This file is one repository telling the truth about
# itself against that format, and "one repository" is the whole job: every claim
# below was measured on THIS tree. Two of them could have been wrong and were —
# what the suite actually prints, and what the gate does when the pinned
# toolchain is not the one on PATH. Both measurements are quoted where they are,
# because a declaration whose comments say "measured" and whose numbers were
# guessed is worse than no comment at all.
version: 1
name: cafaye-ts

gate:
  # `mise run prime`, NOT `./bin/prime`, and the difference is not cosmetic.
  #
  # Measured on this repository, 2026-09-30: with node 22.12.0 — the version
  # mise activates one directory up, and a perfectly ordinary thing to have on
  # PATH — `./bin/prime` exits 0 with `# pass 187`. npm prints EBADENGINE for
  # cafaye-ts and for all five @hey-api packages, and nothing fails. Neither
  # `engines.node: ">=22.19.0"` in package.json nor
  # `@hey-api/openapi-ts`'s own `>=22.18.0` is enforced by `npm ci`; they are
  # warnings, and a warning is not a gate. So a bare `bin/prime` is a gate that
  # can be green against a toolchain this repository never chose — which is the
  # hazard bin/prime's own header warns about, arriving anyway, by the most
  # obvious route. `mise run prime` applies the pin from mise.toml, so the
  # `==> node v22.19.0` in the log is a number the declaration can stand behind.
  #
  # The count in that sentence is the historical one and stays the historical one.
  # It is a measurement dated 2026-09-30, and editing it to today's 201 would make
  # the paragraph describe a run that never happened. `minimum` below is the live
  # number and it moved for a reason: cafaye-ts-01b added
  # `test/spec-drift.test.mjs`, eleven assertions in all.
  #
  # The cost of this choice, stated rather than hidden: `command[0]` is then a
  # bare name, so `check_command` cannot see the file and reports
  # `gate.command-unknown` on a machine without mise. That is the checker's
  # designed answer for "this is a claim about the machine", and it is the right
  # one here — but it does mean `entrypoint`, below, is what carries the
  # on-disk proof for this gate.
  command: [mise, run, prime]
  # The fleet's spelling, and this repository's own: the header of mise.toml
  # names `mise run prime` as the gate in as many words.
  miseTask: prime
  # The file behind both. `mise run prime` and CI's `./bin/prime` are one gate
  # reached two ways, and this is the single file the two agree on — which is
  # the one thing `gate.task-unresolvable` exists to keep them agreeing about.
  entrypoint: bin/prime
  # Measured 45s (direct, warm cache) and 66s (through `mise run`, cold npm
  # cache) on an M-series laptop. A cold CI runner pays for 54 packages first, on
  # a network nobody here controls. Deliberately generous, and the reason is the
  # one core's own gate.yml gives: a floor tight enough to catch a hang is tight
  # enough to flake on somebody's first run, and a flaky gate is a gate people
  # stop reading.
  timeoutSeconds: 900
  proof:
    # 1. The suite's own count. This is the decrease-detector, and it is the
    #    only one of the three that has a floor.
    #
    #    208 is what `npm test` reported on this tree, measured, and it is
    #    raised in the same commit that adds a test — a floor left behind is a
    #    floor nobody notices has stopped protecting anything. A suite that
    #    quietly lost forty tests cannot report itself as passing.
    #
    #    The 201 it replaced was the cafaye-ts-01b floor. cafaye-ts-02b added
    #    `test/customer-capability.test.mjs` — six passing tests, and TWO THAT
    #    FAIL ON PURPOSE — plus one in `readme-examples.test.mjs` that ties the
    #    README's new gap table to the required set in
    #    `scripts/lib/capability.mjs`, so a number in prose cannot go stale. The
    #    floor counts PASSES, so a red test raises nothing and the seven green
    #    ones raise it by seven; the arithmetic is stated here because "the floor
    #    went up by exactly the number of new green tests" is a thing a reader
    #    would otherwise have to reconstruct from a changelog.
    #
    #    208 IS ALSO A COUNT OF A SUITE THAT IS RED, and that is the point of
    #    this proof in its current form. `node --test` exits nonzero when a test
    #    fails, so `bin/prime` is nonzero and core's `gate.nonzero` fires — the
    #    gate is red, by the ordinary mechanism, for a stated reason. The two
    #    reds are ten `identity` tenancy operations that the service serves and
    #    documents nowhere, plus five OpenID Connect operations documented in a
    #    SECOND document this repository does not vendor. Both are named, with
    #    the operation list, in `scripts/lib/capability.mjs` and by
    #    `npm run capability`. Neither is fixable by regenerating, and neither
    #    belongs to this repository to fix by hand; see REPORT-cafaye-ts-02b.md
    #    for which of them is whose.
    #
    #    WHAT MUST NOT HAPPEN is the obvious repair. `test.skip` on the two reds
    #    would leave `# pass` at 208 and `# skipped` at 2, and this file's second
    #    proof fails — that is what `suite-no-skip` is for. Lowering the floor
    #    to 205 to make the arithmetic tidier would be the same mistake with a
    #    different number. The only thing that legitimately lowers `# fail` here
    #    is the two upstream changes named above, and the first of them lands in
    #    `identity`, not here.
    #
    #    The 187 before 201 was the cafaye-ts-02 floor. cafaye-ts-01b added
    #    `test/spec-drift.test.mjs` — eleven assertions covering all six
    #    services' recorded refs, their byte-equality at those refs, and the
    #    staleness report — plus two in `vendored-specs.test.mjs` that turn a
    #    measurement carried in a comment into one computed off the documents on
    #    every run, and one in `suite-is-offline.test.mjs` that asserts each of
    #    its own six rules still catches a violation in its real shape. That last
    #    one is what found a hole in the git rule: the pattern excluded quotes
    #    between `git` and the subcommand, so `execFileSync("git", ["clone", …])`
    #    — the shape this repository's own `workspace.mjs` uses — read as clean.
    #
    #    It is also the line that proves the runner reached its summary at all,
    #    and that is not a formality here. Measured on node 22.19.0: `node
    #    --test` pointed at a glob that matches no file prints `# pass 0` and
    #    exits 0. That is the cafaye-rb defect — a tier that filtered itself out
    #    of existence, a green, and nothing that noticed — reproduced in
    #    TypeScript. 0 < 208, so it is red here.
    - id: suite-pass
      match: '^# pass ([0-9]+)$'
      minimum: 208
    # 1b. The count above cannot distinguish "everything passes" from "the right
    #     number pass and the rest are skipped", and on THIS tree it cannot
    #     distinguish "the right number pass" from "the right number pass and two
    #     deliberate failures are failing". That is a real gap and it is stated
    #     rather than left implicit.
    #
    #     There is no proof shape for "exactly two failures, and here they are":
    #     `gate.proof` can match a line and can hold a floor, and `# fail 2` is
    #     not a floor anybody wants in a gate declaration — the day identity
    #     documents the tenancy surface the number goes to 0 and the floor goes
    #     red, which is the correct direction but for a reason that reads like a
    #     regression. So the count is a REPORT here, printed in the log by
    #     `node --test` and asserted by nothing.
    #
    #     What holds the number instead is `test/capability_self_test.sh`, which
    #     runs four cases against copies of this repository and requires the
    #     control to be red with the two named verdicts, the fixed copy to be
    #     green for tenancy and STILL red for OIDC, a hand-written method to fail
    #     to satisfy anything, and a nine-of-ten document to be red again. If the
    #     two reds ever stop being the two named findings, that script is what
    #     says so. It is deliberately outside `prime`: the glob
    #     `test/**/*.test.mjs` cannot match a `.sh`, and a self-test inside the
    #     gate would mean the gate runs the check that fails on purpose.
    #
    #     The alternative — asserting `# fail 0` and shipping a green gate over
    #     a client that cannot onboard a tenant — is the one this packet exists
    #     to rule out.
    # 2. Nothing skipped, in the suite's own words.
    #
    #    This is the proof the count above cannot make on its own, and the case
    #    was measured rather than imagined. A test rewritten as `test.skip`
    #    raises `# tests` and leaves `# pass` at 201 — the number a reader is
    #    scanning moves, and the number this floor reads does not. `# skipped`
    #    is the only line that moves with it. core's rule is that a skipped check
    #    is not a passing check, and `# skipped 0` is that rule in a form the
    #    checker can read.
    #
    #    It earns its place in a way it did not have to before cafaye-ts-01b,
    #    because spec-drift.test.mjs is the first test here that CAN skip on a
    #    healthy machine: it skips when there is no cafaye workspace beside the
    #    checkout, which is exactly what a self-hoster's `npm install` from npm
    #    looks like. Eleven verified passes is the right answer there. Eleven
    #    skipped checks reported as eleven passes would be the cafaye-rb defect
    #    again, and this proof is what makes it impossible.
    - id: suite-no-skip
      match: '^# skipped 0$'
    # 3. Two of this gate's three steps are silent when they succeed. `npm ci`
    #    prints a package count; `tsc --noEmit` prints NOTHING on success. So
    #    absent this proof, nothing in the whole log is evidence that the frozen
    #    install and the type check over the 96 generated files both succeeded,
    #    and `gate.proof` cannot see two thirds of the gate.
    #
    #    bin/prime echoes `==> npm test` only after `npm run typecheck` has
    #    returned 0, under `set -euo pipefail`. Reaching that line is the
    #    evidence. This proof is therefore coupled to a human-editable echo, and
    #    that is the intended direction of travel: reword the echo and the
    #    declaration goes red, because at that point the declaration can no
    #    longer see what the gate did. Update both in one commit.
    - id: install-and-typecheck
      match: '^==> npm test$'

external:
  # NOT self-contained, and saying so is the point of the block. A reader can
  # tell from this file, without running anything, that a green gate here needed
  # a toolchain mise had to install and a registry npm had to reach. The
  # declaration that said `true` would be describing a gate nobody has ever run
  # on a clean machine.
  selfContained: false
  requirements:
    - kind: toolchain
      name: node 22.19.0 and the npm that ships with it, installed by mise from mise.toml
      satisfy:
        command: [mise, install]
        # Observed, not predicted: `env -i PATH=/usr/bin:/bin bin/prime` prints
        # this and exits 127. Note what the same command does NOT do — it is
        # only `mise run prime` that turns an unpinned node on PATH into a
        # failure rather than a warning; see the comment on `command` above.
        unmet: bin/prime exits 127 with "prime: node is not on PATH. Run 'mise install' first"
    - kind: network
      name: the npm registry, or a ~/.npm cache already holding every tarball in package-lock.json
      satisfy:
        command: [npm, ci]
        # Observed, not predicted: `npm ci --offline` against an empty cache
        # prints this and exits 1, leaving no node_modules/. `npm ci` deletes
        # node_modules and reinstalls the lockfile from scratch on EVERY run —
        # this is core's "PyPI, once, on a cold checkout", except npm has no
        # step that only runs once, so it is a requirement on every gate run and
        # a cache is what makes it invisible.
        unmet: bin/prime's npm ci step exits 1 with "npm error code ENOTCACHED" and leaves no node_modules/
  # NOT required, and named here so nobody goes looking for them: no database, no
  # running service, no credential, and no network once npm's cache is warm.
  #
  # The last one is the one that would be got wrong here, because
  # test/suite-is-offline.test.mjs exists precisely to keep the SUITE offline.
  # That test is about the 201 tests and it holds: they never fetch the six
  # OpenAPI documents, because the vendored bytes under specs/ are the artifact
  # and the shas in specs/index.json are their provenance. The gate is a
  # different question. `npm ci` reaches the registry before any test runs, so
  # the offline suite does not make the offline gate.
  #
  # AND IT STILL HOLDS WITH `test/spec-drift.test.mjs` IN THE SUITE, which is
  # the thing worth stating plainly because it is the newest claim here.
  # spec-drift.test.mjs reads each document out of a SIBLING CHECKOUT with
  # `git cat-file`, which is the local object store and contacts no remote. It
  # needs the six clones to EXIST — which is why CI clones them, in a step before
  # bin/prime, because `$GITHUB_ENV` applies to later steps only — and a run with
  # no workspace beside it reports eleven SKIPPED tests rather than eleven passes.
  # `# skipped 0` above is what makes that honest: the proof fails if the drift
  # test skips, so "could not verify" can never be read as "verified".
  #
  # What is NOT required is a Postgres and a running identity. Those belong to
  # `npm run e2e:identity`, which is not in the gate and must not become part of
  # it: see the header of scripts/e2e-identity.mjs for why a test that starts a
  # service and a database does not belong beside a suite that must run offline.

ci:
  workflow: .github/workflows/ci.yml
  # CI runs the SCRIPT, not the task, and that is deliberate rather than an
  # inconsistency: actions/setup-node puts an explicit node on PATH, so CI pins
  # the toolchain without mise being involved at all. `invokes` is allowed to
  # name a different spelling of the same entrypoint, which is why this is
  # bin/prime and not `mise run prime` — the workflow has never run mise.
  #
  # The matrix runs node 22.19.0 AND node 24. Node 24 is above the floor and not
  # the pinned version, and it is not a contradiction of the requirement above:
  # a floor that has only ever been tested AT the floor is a floor nobody has
  # checked anything above. CI proves both halves; the local gate proves the
  # pinned one, which is the one a local run can be trusted to have used.
  invokes: [bin/prime]
  # AND THE WORKFLOW HAS TWO STEPS THAT RUN WHEN THAT ONE IS RED, which is
  # unusual enough to say why. `bin/prime` is red on purpose — the two capability
  # findings — and a red step that stops a job tells a reader only that something
  # failed. So the workflow then runs `npm run capability`, which prints the
  # fifteen operations with the reason each is on a customer's path, and
  # `bash test/capability_self_test.sh`, which proves the check can go green and
  # that a hand-written method cannot make it. Both are `continue-on-error`: they
  # are reporting, not gating, and a report that fails a job is a gate. The
  # declarations they read are `gate.proof` above and the `suite-pass` comment,
  # and the two must move together — the workflow printing a list is only useful
  # if the floor in this file still counts what the list says is failing.
